name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev tmux

      - name: Start tmux server (required for bridge integration tests)
        run: tmux new-session -d -s _bentoya_ci_keepalive 'sleep 86400'

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: IPC registration check
        run: pnpm run test:ipc
      - name: Type scale check
        run: pnpm run test:type-scale
      - name: Rust module check
        run: pnpm run test:rust-modules

      - name: Frontend tests
        run: pnpm exec vitest run

      # Runs last so a new advisory never masks the test results.
      # Suppressions live in package.json → pnpm.auditConfig.ignoreGhsas.
      - name: Dependency audit
        run: pnpm audit --audit-level moderate

  notify-failure:
    name: Notify failure
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    if: ${{ github.event_name == 'push' && always() && contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Post-merge CI failed on \`main\` for commit ${context.sha}.`,
              '',
              `Run: ${runUrl}`,
              `Pusher: @${context.actor}`,
              '',
              'Checks run:',
              '- Rust: `cargo check --workspace`, `cargo clippy --workspace --all-targets -- -D warnings`, `cargo test --workspace`',
              '- Frontend: `pnpm run type-check`, `pnpm run lint`, `pnpm run test:ipc`, `pnpm run test:type-scale`, `pnpm run test:rust-modules`, `pnpm audit --audit-level moderate`, `pnpm exec vitest run`',
              '',
              'Please inspect the failed workflow run and fix main.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Post-merge CI failed on main (${sha})`,
              body
            });
